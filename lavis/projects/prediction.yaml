model:
  arch: blip2_portein_smiles_matching
  model_type: pretrain
  prefix_pretrained: /lnvme/home/niu_bu_ying/WiseInteract/lavis/output/model2/ ###
  pretrained: /lnvme/home/niu_bu_ying/WiseInteract/lavis/output/model2/ 
  use_grad_checkpoint: False

datasets:
  cpi_prediction: 
    build_info:
      test:
        url: /lnvme/home/niu_bu_ying/WiseInteract/data/pairs_200_226.parquet
      use_neg: others 
    proteins_processor:
        train:
          name: "proteins_processor"
        val:
          name: "proteins_processor"
        test:
          name: "proteins_processor"
    smiles_processor:
        train:
          name: "smiles_processor"
        val:
