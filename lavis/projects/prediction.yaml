  batch_size_eval: 1500
  batch_size_test: 1500
  num_workers: 6
  
  seed: 8686
  output_dir: "output/pair" ###

  evaluate: True
  test_splits: ["test"]
  evaluation_way: "pcm" 
  datasets: "test"
  test_path: /lnvme/home/niu_bu_ying/WiseInteract/data/pairs_200_226.parquet

  # distribution-specific
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
