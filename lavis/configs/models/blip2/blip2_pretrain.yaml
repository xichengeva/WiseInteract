model:
  arch: pretrain
  load_finetuned: False
  finetuned: ""

  # protein encoder
  protein_embedding_size: 1280
  drop_path_rate: 0
  use_grad_checkpoint: False
  freeze_protein: True

  # Q-Former
  num_query_token: 32


preprocess:
    protein_processor:
        train:
          name: "proteins_processor"
    text_processor:
        train:
          name: "smiles_processor"
